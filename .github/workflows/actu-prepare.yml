name: actu-prepare
# Étape 1 Actu : sujet du jour + vérif 2 sources + paroles + prompt Suno (clé API, pas l'abonnement)
on:
  workflow_dispatch:
  push:
    paths: ['.github/actu-trigger']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brief
        env: { ANTHROPIC_API_KEY: '${{ secrets.ANTHROPIC_API_KEY }}' }
        run: python3 tools/actu_prepare.py | tee /tmp/out.txt
      - name: Commit
        run: |
          git config user.name "machine-tiktok-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/actu && git commit -m "actu: brief $(head -1 /tmp/out.txt)" && git push
