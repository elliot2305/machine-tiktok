name: preview-motion
# Aperçu de style Actu v2 (motion 3D, sans son) : déclenché en modifiant .github/motion-trigger. Aucun appel API.
on:
  push:
    paths: ['.github/motion-trigger', 'scene/motion.html']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
        timeout-minutes: 8
      - run: npm install --no-audit --no-fund && npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Rendu
        run: |
          mkdir -p out/stills
          node tools/render.js motion - out/motion_silent.mp4 --scene motion --workers 4
          node tools/render.js motion - out/stills --scene motion --stills 0.8,2,3.5,5,6.5,8.5,9.8
          ls -la out out/stills
      - name: Copie sur la branche rendus
        run: |
          mkdir -p /tmp/r && cd /tmp/r && git init -q && git checkout -q -b rendus
          git config user.name "machine-tiktok-bot"; git config user.email "actions@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch -q origin rendus && git reset -q --soft origin/rendus || true
          mkdir -p motion_${{ github.run_id }} && cp -r $GITHUB_WORKSPACE/out/* motion_${{ github.run_id }}/
          git add --ignore-removal . && git commit -qm "aperçu motion ${{ github.run_id }}" && git push -q origin rendus
