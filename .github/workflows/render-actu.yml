name: render-actu
# Étape 3 Actu : dès qu'un song.mp3 + alignment.json (Suno) arrive dans data/actu/<slug>/, rend le clip
on:
  workflow_dispatch:
    inputs:
      dir: { description: 'Dossier du clip (data/actu/<slug>)', required: true }
  push:
    paths: ['data/actu/**/song.mp3']
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg bc
      - run: npm install --no-audit --no-fund && npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Rendu
        run: |
          mkdir -p out
          DIRS="${{ github.event.inputs.dir }}"
          [ -z "$DIRS" ] && DIRS=$(git diff --name-only HEAD~1 HEAD -- 'data/actu/**/song.mp3' | xargs -r -n1 dirname)
          for d in $DIRS; do
            s=$(basename $d)
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 $d/song.mp3)
            python3 tools/actu_build.py $d $dur
            node tools/render.js $d/clip.json - out/${s}_silent.mp4 --scene actu --workers 4
            tools/mux.sh out/${s}_silent.mp4 $d/song.mp3 out/Actu_${s}.mp4
          done
      - uses: actions/upload-artifact@v4
        with: { name: actu-mp4, path: out/Actu_*.mp4, retention-days: 30 }
