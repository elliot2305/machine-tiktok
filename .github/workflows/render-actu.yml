name: render-actu
# Étape 3 Actu : dès qu'un song.mp3 + alignment.json (Suno) arrive dans data/actu/<slug>/, rend le clip
on:
  workflow_dispatch:
    inputs:
      dir: { description: 'Dossier du clip (data/actu/<slug>)', required: true }
  push:
    paths: ['data/actu/**/song.mp3', 'data/histoire/**/song.mp3', 'data/actu/**/song-url.txt', 'data/histoire/**/song-url.txt', 'data/*/**/rerender.txt']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg bc
        timeout-minutes: 8
      - run: npm install --no-audit --no-fund && npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Rendu
        run: |
          mkdir -p out
          DIRS="${{ github.event.inputs.dir }}"
          [ -z "$DIRS" ] && DIRS=$(git diff --name-only HEAD~1 HEAD -- 'data/*/**/song.mp3' 'data/*/**/song-url.txt' 'data/*/**/rerender.txt' | xargs -r -n1 dirname | sort -u)
          for d in $DIRS; do
            s=$(basename $d)
            [ -f $d/song.mp3 ] || curl -sSLf -o $d/song.mp3 "$(head -1 $d/song-url.txt)"
            [ -f $d/song.mp3 ] || { echo "pas de MP3 pour $d"; exit 1; }
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 $d/song.mp3)
            python3 tools/fetch_photos.py $d || true
            python3 tools/actu_build.py $d $dur
            node tools/render.js $d/clip.json - out/${s}_silent.mp4 --scene actu --workers 4
            mkdir -p out/stills/$s && node tools/render.js $d/clip.json - out/stills/$s --scene actu --stills 0.5,3,15,30,50,$(python3 -c "print(round(float(open('$d/cut.txt').read())-2,1))")
            ffmpeg -loglevel error -y -ss $(cat $d/skip.txt) -i $d/song.mp3 -c:a libmp3lame -q:a 2 /tmp/song_${s}.mp3
            tools/mux.sh out/${s}_silent.mp4 /tmp/song_${s}.mp3 out/Clip_${s}.mp4
          done
      - uses: actions/upload-artifact@v4
        with: { name: actu-mp4, path: out/Clip_*.mp4, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: apercus, path: out/stills, retention-days: 30 }
      - name: Copie sur la branche rendus (lisible depuis Claude)
        run: |
          mkdir -p /tmp/r && cd /tmp/r && git init -q && git checkout -q -b rendus
          git config user.name "machine-tiktok-bot"; git config user.email "actions@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch -q origin rendus && git reset -q --soft origin/rendus || true
          mkdir -p run_${{ github.run_id }} && cp -r $GITHUB_WORKSPACE/out/Clip_*.mp4 $GITHUB_WORKSPACE/out/stills run_${{ github.run_id }}/
          git add --ignore-removal . && git commit -qm "rendu run ${{ github.run_id }}" && git push -q origin rendus
