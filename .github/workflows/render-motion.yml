name: render-motion
# Actu v2 (motion 3D) : rend data/motion/<slug> (clip.json + song.mp3) avec scene/motion_clip.html. Aucun appel API.
on:
  push:
    paths: ['data/motion/**/clip.json', 'scene/motion_clip.html']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg bc
        timeout-minutes: 8
      - run: npm install --no-audit --no-fund && npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Rendu
        run: |
          mkdir -p out
          for d in data/motion/*/; do
            d=${d%/}; s=$(basename $d)
            skip=$(python3 -c "import json;print(json.load(open('$d/clip.json'))['skip'])")
            node tools/render.js $d - out/${s}_silent.mp4 --scene motionclip --workers 4
            mkdir -p out/stills/$s && node tools/render.js $d - out/stills/$s --scene motionclip --stills 1,6,11,15,20,25,28,31,36,39,44,49,54,58,60.5
            ffmpeg -loglevel error -y -ss $skip -i $d/song.mp3 -c:a libmp3lame -q:a 2 /tmp/song_$s.mp3
            tools/mux.sh out/${s}_silent.mp4 /tmp/song_$s.mp3 out/Clip_$s.mp4
            rm out/${s}_silent.mp4
          done
      - name: Copie sur la branche rendus
        run: |
          mkdir -p /tmp/r && cd /tmp/r && git init -q && git checkout -q -b rendus
          git config user.name "machine-tiktok-bot"; git config user.email "actions@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch -q origin rendus && git reset -q --soft origin/rendus || true
          mkdir -p clip_${{ github.run_id }} && cp -r $GITHUB_WORKSPACE/out/* clip_${{ github.run_id }}/
          git add --ignore-removal . && git commit -qm "clip motion ${{ github.run_id }}" && git push -q origin rendus
