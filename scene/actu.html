<!doctype html><html><head><meta charset="utf-8">
<!-- Actu en chanson : format v5 validé, généralisé. Données : ?clip=data/actu/AAAA-MM-JJ/clipN.json -->
<style>
@font-face{font-family:Anton;src:url(/node_modules/@fontsource/anton/files/anton-latin-ext-400-normal.woff2)}
@font-face{font-family:Anton;src:url(/node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}
html,body{margin:0;overflow:hidden;background:#000;width:1080px;height:1920px}
canvas{position:absolute;left:0;top:0}
#ui{position:absolute;inset:0;font-family:Anton;color:#fff;text-align:center}
#shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 58%,rgba(0,0,0,.88) 86%)}
#head{position:absolute;left:0;right:0;top:120px}
#flash{display:inline-block;background:#e10600;padding:10px 30px 4px;font-size:56px;letter-spacing:5px}
#title{font-size:104px;line-height:1.02;margin:22px 40px 0;letter-spacing:3px;text-shadow:0 8px 30px rgba(0,0,0,.8)}
.card{position:absolute;left:30px;right:30px;top:640px;opacity:0;transform-origin:50% 40%}
.big{font-size:210px;line-height:.92;letter-spacing:4px;text-shadow:0 10px 40px rgba(0,0,0,.9)}
.pill{display:inline-block;background:rgba(0,0,0,.72);padding:18px 40px 4px}
.sub{display:inline-block;font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:50px;margin-top:18px;text-transform:uppercase;background:rgba(0,0,0,.72);padding:6px 20px}
.camps{display:flex;justify-content:center;gap:36px;margin-top:40px}
.c{padding:26px 46px 16px;font-size:96px;letter-spacing:3px}.c.a{background:#e10600}.c.b{background:#1c3d8f}
.split{display:flex}.split>div{flex:1}
#lyr{position:absolute;left:40px;right:40px;bottom:290px;font-size:66px;line-height:1.08;letter-spacing:2px;text-transform:uppercase;text-shadow:0 4px 16px #000}
.w{color:rgba(255,255,255,.42)}.w.on{color:#fff}
#src{position:absolute;left:0;right:0;bottom:170px;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:34px;opacity:.85}
#ia{position:absolute;right:30px;top:40px;max-width:760px;text-align:right;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:26px;opacity:.7;background:rgba(0,0,0,.5);padding:4px 12px}
#part{position:absolute;left:30px;top:40px;font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:28px;background:#e10600;padding:4px 12px}
#flashw{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body>
<canvas id="bg" width="1080" height="1920"></canvas>
<div id="ui">
 <div id="shade"></div>
 <div id="head"><div id="flash">FLASH INFO</div><div id="title"></div></div>
 <div id="cards"></div>
 <div id="lyr"></div>
 <div id="src"></div>
 <div id="ia">Illustration IA</div>
 <div id="part"></div>
 <div id="flashw"></div>
</div>
<script>
const W=1080,H=1920,g=document.getElementById('bg').getContext('2d');const $=id=>document.getElementById(id);
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
const q=new URLSearchParams(location.search);let C,IM=[],LINES=[],SHOTS=[];
// Fumée/fumigènes : particules qui montent depuis le bas, couleurs rouge/bleu du format.
const SMOKE=[...Array(14)].map((_,i)=>[(i*173+90)%1080,1350+(i*97)%500,i%3==2?'60,110,255':'255,45,30']);
const drops=[...Array(160)].map((_,i)=>[(i*97)%1080,(i*389)%1920,.6+((i*7)%10)/10]);
function photo(t,k,zoom,cx,cy){const FX=C.fx!==false;const im=IM[k];g.save();g.fillStyle='#000';g.fillRect(0,0,W,H);
 const base=Math.max(W/im.width,H/im.height),sc=base*zoom,hh=H/2/sc,hw=W/2/sc;
 cy=Math.min(im.height-hh,Math.max(hh,cy*im.height));cx=Math.min(im.width-hw,Math.max(hw,cx*im.width));
 g.translate(W/2,H/2);g.scale(sc,sc);g.translate(-cx,-cy);g.drawImage(im,0,0);g.restore();
 g.save();g.globalCompositeOperation='screen';
 if(FX)SMOKE.forEach(([x,y,c],i)=>{for(let j=0;j<6;j++){const life=((t*.18+j/6+i*.13)%1);const px=x+Math.sin(t*.6+j+i)*30+life*(i%2?-60:60),py=y-life*420,r=60+life*170;
  const gr=g.createRadialGradient(px,py,0,px,py,r);gr.addColorStop(0,`rgba(${c},${.16*(1-life)})`);gr.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gr;g.fillRect(px-r,py-r,2*r,2*r)}
  if(i%4==0){const f=.5+.5*Math.abs(Math.sin(t*15+i*2.3))*Math.abs(Math.sin(t*5.1+i));const gr=g.createRadialGradient(x,y,0,x,y,70);gr.addColorStop(0,`rgba(${c},${.55*f})`);gr.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gr;g.fillRect(x-70,y-70,140,140)}});
 g.restore();g.save();g.strokeStyle='rgba(200,215,255,.2)';g.lineWidth=2;
 if(FX)for(const [x,y,v] of drops){const yy=(y+t*1400*v)%H;g.beginPath();g.moveTo(x,yy);g.lineTo(x-6,yy+38*v);g.stroke()}
 const v=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.62)');g.fillStyle=v;g.fillRect(0,0,W,H);g.restore()}
function cardHTML(c){const nb=x=>String(x||'').replace(/(\d) (?=[\d€])/g,'$1&nbsp;');c={...c,big:nb(c.big),sub:c.sub&&nb(c.sub)};
 if(c.type==='split')return `<div class="split">${c.items.map(it=>`<div><div class="pill" style="padding:12px 18px 0"><div class="big" style="font-size:118px;color:${it.color||'#fff'}">${it.big}</div></div><br><div class="sub" style="font-size:36px">${it.sub}</div></div>`).join('')}</div>`;
 if(c.type==='camps')return `<div class="big" style="font-size:190px">${c.big}</div><div class="camps"><div class="c a">${c.a||'POUR'}</div><div class="c b">${c.b||'CONTRE'}</div></div>`;
 const big=`<div class="big" style="${c.size?`font-size:${c.size}px;`:''}${c.color?`color:${c.color}`:''}">${c.big}</div>`;
 return (c.color==='#ff3b30'?`<div class="pill">${big}</div><br>`:big)+(c.sub?`<div class="sub" style="${c.subColor?`color:${c.subColor}`:''}">${c.sub}</div>`:'');}
window.__seek=t=>{
 const sh=Math.sin(t*31)*1.2;const s=SHOTS.find(s=>t>=s.t0&&t<s.t1)||SHOTS[SHOTS.length-1];const k=ease((t-s.t0)/(s.t1-s.t0));
 photo(t,s.img,s.z0+(s.z1-s.z0)*k,s.x0+(s.x1-s.x0)*k,s.y0+(s.y1-s.y0)*k+sh/1280);
 C.cards.forEach((c,i)=>{const el=$('k'+i);if(t>=c.t0&&t<c.t1){const kk=ease((t-c.t0)/.18);el.style.opacity=1;el.style.transform=`scale(${1.25-.25*kk})`}else el.style.opacity=0});
 $('flashw').style.opacity=C.cards.some(c=>t>=c.t0&&t<c.t0+.07)?.4:0;
 const L=LINES.find(l=>t>=l.t0-.15&&t<l.t1+.6);let h='';if(L)L.words.forEach(w=>{h+=`<span class="w${t>=w.t0?' on':''}">${w.w}</span> `});$('lyr').innerHTML=h};
(async()=>{C=await (await fetch('/'+q.get('clip'))).json();window.__duration=C.duration;
 $('title').textContent=C.title;$('flash').textContent=C.kicker||'FLASH INFO';if(C.kicker&&C.kicker!=='FLASH INFO')$('flash').style.background='#7b2cff';$('ia').textContent=C.credit||(C.ia===false?'Photos : Wikimedia Commons':'Illustration IA');$('src').textContent='Sources : '+C.sources.join(' · ');$('part').textContent=C.part||'';
 $('cards').innerHTML=C.cards.map((c,i)=>`<div class="card" id="k${i}" style="${c.top?`top:${c.top}px`:''}">${cardHTML(c)}</div>`).join('');
 IM=await Promise.all(C.images.map(src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src='/'+src})));
 // Plans : on alterne les 3 images, ~5 s par plan, zoom/pan différents à chaque passage.
 const n=Math.max(3,Math.round(C.duration/5));const moves=[[1.35,1.08,.5,.5,.62,.42],[1.05,1.22,.4,.6,.5,.45],[1.25,1.05,.6,.4,.4,.55],[1.1,1.3,.5,.5,.35,.6]];
 for(let i=0;i<n;i++){const m=moves[i%4];SHOTS.push({t0:i*C.duration/n,t1:(i+1)*C.duration/n,img:i%IM.length,z0:m[0],z1:m[1],x0:m[2],x1:m[3],y0:m[4],y1:m[5]})}
 LINES=C.lines;await document.fonts.ready;window.__seek(0);window.__ready=true})();
</script></body></html>
